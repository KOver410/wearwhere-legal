    .card:hover { border-color: #bbb; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .card h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .card p { margin: 0; color: var(--muted); font-size: .95rem; }
